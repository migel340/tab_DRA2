spring.application.name=dra2

# PostgreSQL datasource (for local development)
# When running the app in Docker compose change host to 'db' or use the following URL:
# jdbc:postgresql://db:5432/dra2db
spring.datasource.url=jdbc:postgresql://localhost:5432/dra2db
spring.datasource.username=dra2user
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
# Hibernate will auto-select the correct dialect for PostgreSQL; explicit setting removed
# Use 'update' for development, consider 'validate' or migrations for production
spring.jpa.hibernate.ddl-auto=update

# ==================== JWT ====================
app.jwt.secret=FestDlugieNieironiczneHaslo1234567890qwerty!
app.jwt.expiration-ms=86400000

# ==================== SWAGGER ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==================== DEBUG (SQL w konsoli) ====================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== LOGOWANIE REQUESTÓW ====================
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG